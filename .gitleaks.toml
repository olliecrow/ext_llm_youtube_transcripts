title = "ext_llm_youtube_transcripts gitleaks policy"

[extend]
useDefault = true

[[rules]]
id = "local-system-paths"
description = "Do not commit local absolute system paths in this public-ready repository."
# The secret is the path without its leading slash. The default global
# allowlist skips any secret that starts with /home/ or /Users/<name>/,
# so a secret with the slash would never be reported.
regex = '''(?:/(Users/[A-Za-z0-9._-]+)|/(home/[A-Za-z0-9._-]+)|([A-Za-z]:\\+Users\\+[A-Za-z0-9._-]+))'''
tags = ["policy", "privacy"]

[[rules.allowlists]]
description = "Allow a match only when the whole match is a placeholder path. Other paths on the same line are still reported."
regexTarget = "secret"
regexes = [
  '''^(Users/(YOU|USER|username)|home/(user|USER|username)|[A-Za-z]:\\+Users\\+(YOU|USER|USERNAME|username))$'''
]
