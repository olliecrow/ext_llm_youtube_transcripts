name: Repository Checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly security scan. Monday 06:17 UTC avoids the crowded top of the hour.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run automated validation
        run: ./validate.sh

  security-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSfL -o "${archive}" "${base_url}/${archive}"
          curl -sSfL -o checksums.txt "${base_url}/gitleaks_${version}_checksums.txt"
          grep "${archive}" checksums.txt | sha256sum -c -
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum -c -
          mkdir gitleaks-unpack
          tar -xzf "${archive}" -C gitleaks-unpack
          install -m 0755 gitleaks-unpack/gitleaks "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan pushed/PR commit range with gitleaks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="$(bash scripts/security/resolve-commit-range.sh)"
          # Also scan what a merge commit adds against its first parent.
          bash scripts/security/gitleaks-range.sh "${range}"

      - name: Test security scanners with gitleaks
        run: node --test test/security-policy.test.js

      - name: Self-test gitleaks path policy
        run: |
          set -euo pipefail
          sample_dir="$(mktemp -d)"
          printf 'docs: keep /Users/YOU as placeholder only\n' > "${sample_dir}/sample.txt"
          gitleaks dir --no-banner --redact --config .gitleaks.toml "${sample_dir}"
          printf 'docs: /Users/YOU and /Users/%s\n' "someone" > "${sample_dir}/sample.txt"
          if gitleaks dir --no-banner --redact --config .gitleaks.toml "${sample_dir}"; then
            echo "expected gitleaks to report a real path beside a placeholder" >&2
            exit 1
          fi

      - name: Check pushed/PR commit messages and added lines
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="$(bash scripts/security/resolve-commit-range.sh)"
          bash scripts/security/check-push-range.sh --range "${range}"

      - name: Check pull request title/body for policy violations
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          temp_file="$(mktemp)"
          printf '%s\n\n%s\n' "${PR_TITLE}" "${PR_BODY}" > "${temp_file}"
          bash scripts/security/check-sensitive-text.sh --context=pr-metadata "${temp_file}"
